  <script>
    // The first-visit intro starts on ink: paint the boot screen ink too so
    // there is no paper → ink flash while Angular boots.
    (function () {
      try {
        var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var seen = sessionStorage.getItem('intro_seen') === '1';
        if (!reduced && !seen && location.pathname.indexOf('/admin') !== 0) {
          document.documentElement.className += ' boot-dark';
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* Critical boot styles — no white flash before Angular loads */
    html, body { margin: 0; background: #f2f0eb; }
    .boot-screen { position: fixed; inset: 0; display: grid; place-items: center; background: #f2f0eb; }
    .boot-mark { width: 44px; height: 44px; border-radius: 50%; background: #0d0d10; display: grid; place-items: center; animation: boot-pulse 1.2s ease-in-out infinite; }
    .boot-mark svg { width: 24px; height: 24px; fill: none; stroke: #f2f0eb; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    html.boot-dark, html.boot-dark body, html.boot-dark .boot-screen { background: #0d0d10; }
    html.boot-dark .boot-mark { background: transparent; }
    @keyframes boot-pulse { 50% { transform: scale(0.92); opacity: 0.6; } }
    @media (prefers-reduced-motion: reduce) { .boot-mark { animation: none; } }
  </style>
</head>
<body>
  <app-root>
    <div class="boot-screen" aria-label="Loading">
      <div class="boot-mark"><svg viewBox="0 0 32 32"><path d="M5 6l7 10v10M19 6l-7 10M19 6l4 6 4-6M23 12v14"/></svg></div>
    </div>
  </app-root>
</body>
